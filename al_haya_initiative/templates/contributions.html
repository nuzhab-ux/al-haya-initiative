{% extends "base.html" %}{% block content %}<h1>Contributions</h1><form method="post" class="formgrid"><select name="member_id" required>{% for m in members %}<option value="{{m.id}}">{{m.name}}</option>{% endfor %}</select><select name="type"><option value="initial">Initial</option><option value="monthly">Monthly</option><option value="increment">Increment</option></select><input name="amount" type="number" step="0.01" placeholder="Amount" required><input name="paid_date" type="date"><input name="note" placeholder="Note"><button>Record</button></form><table><tr><th>Member</th><th>Type</th><th>Amount</th><th>Date</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.type}}</td><td>{{fmt(r.amount)}}</td><td>{{r.paid_date}}</td></tr>{% endfor %}</table>{% endblock %}
