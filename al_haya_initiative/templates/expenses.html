{% extends "base.html" %}{% block content %}<h1>Expenses</h1><p><b>Product:</b> recoverable, does not reduce capital. <b>Necessary:</b> non-recoverable and reduces capital.</p><form method="post" class="formgrid"><select name="expense_type"><option value="product">Recoverable Product Expense</option><option value="necessary">Necessary Expense</option></select><input name="title" placeholder="Title" required><input name="amount" type="number" step="0.01" placeholder="Amount" required><input name="expense_date" type="date"><input name="recipient" placeholder="Recipient"><input name="description" placeholder="Description"><button>Record</button></form><table><tr><th>Type</th><th>Title</th><th>Amount</th><th>Date</th></tr>{% for r in rows %}<tr><td>{{r.expense_type}}</td><td>{{r.title}}</td><td>{{fmt(r.amount)}}</td><td>{{r.expense_date}}</td></tr>{% endfor %}</table>{% endblock %}
