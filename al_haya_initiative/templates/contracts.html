{% extends "base.html" %}{% block content %}<h1>Client Contracts</h1><form method="post" class="formgrid"><select name="client_id" required>{% for c in clients %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="product_name" placeholder="Product name" required><input name="product_cost" type="number" step="0.01" placeholder="Product cost" required><input name="profit_rate" type="number" step="0.01" placeholder="Profit %" required><select name="months"><option>3</option><option>6</option><option>8</option><option selected>12</option></select><input name="start_date" type="date"><button>Create Contract</button></form><table><tr><th>Client</th><th>Product</th><th>Cost</th><th>Profit</th><th>Sale</th><th></th></tr>{% for c in contracts %}<tr><td>{{c.client_name}}</td><td>{{c.product_name}}</td><td>{{fmt(c.product_cost)}}</td><td>{{fmt(c.total_profit)}}</td><td>{{fmt(c.total_sale_price)}}</td><td><a href="{{url_for('contract_detail',cid=c.id)}}">Open</a></td></tr>{% endfor %}</table>{% endblock %}
